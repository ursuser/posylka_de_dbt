version: 2

models:
  - name: int_crm__supplies_stock
    config:
      tags: ['daily', 'crm']
    description: >
      one row per product_sku. single source of truth for inventory analytics:
      stock levels, turnover, margin, and redundant-order detection.
      analysis window starts 2025-06-01 for both supplies and sales.
    columns:
      - name: product_sku
        tests:
          - not_null
          - unique
      - name: total_procured_units
        tests:
          - not_null
      - name: stock_units
        description: total_procured_units minus total_sold_units since 2025-06-01
      - name: avg_purchase_price
        description: weighted average — total_procured_cost / total_procured_units
      - name: avg_selling_price
        description: weighted average over orders where unit_price > 0 (excludes amazon zero-price records)
      - name: turnover_days
        description: stock_units / avg_daily_sales. null when no sales recorded
      - name: stock_days_at_last_procurement
        description: estimated days of stock on hand at the moment the last procurement was placed — flags redundant ordering

  - name: int_ga4_purchases
    config:
      tags: ['daily', 'ga4']
    description: ga4 purchase events with attribution (last-click, first-click, last-non-direct-click), one row per transaction_id
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: event_date
        tests:
          - not_null

  - name: int_gclid_campaign
    description: gclid to campaign name mapping, one row per gclid
    columns:
      - name: gclid
        tests:
          - not_null
          - unique

  - name: int_session_real_sm
    config:
      tags: ['daily', 'ga4']
    description: the real source/medium for each session
    columns:
      - name: user_pseudo_id
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null
          - unique:
              config:
                severity: warn
