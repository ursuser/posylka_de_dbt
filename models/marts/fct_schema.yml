version: 2

models:
  - name: fct_events_real_sm
    config:
      tags: ['daily', 'ga4']
    description: all basic events with session source - medium
    columns:
      - name: event_date
        tests:
          - not_null

  - name: fct_tech_events
    config:
      tags: ['daily', 'ga4']
    description: all basic events via technology
    columns:
      - name: event_date
        tests:
          - not_null
      - name: category
        tests:
          - not_null

  - name: fct_landing_page
    config:
      tags: ['daily', 'ga4']
    description: conversion events via landing page
    columns:
      - name: event_date
        tests:
          - not_null
      - name: landing_page
        tests:
          - not_null
      - name: device_category
        tests:
          - not_null

  - name: fct_search_term_intern
    config:
      tags: ['daily', 'ga4']
    description: intern search terms on the site
    columns:
      - name: event_date
        tests:
          - not_null
      - name: search_term
        tests:
          - not_null
      - name: device_category
        tests:
          - not_null

  - name: fct_seach_console
    config:
      tags: ['daily', 'ga4']
    description: data from search console joined with ga4 data
    columns:
      - name: date
        tests:
          - not_null
      - name: device_category
        tests:
          - not_null
      - name: landing_page
        tests:
          - not_null

  - name: fct_crm_sales
    config:
      tags: ['daily', 'crm']
    description: order-level crm fact table with status, customer type, delivery days and refund flags

  - name: fct_cohorts
    config:
      tags: ['weekly', 'crm']
    description: cohort retention table with monthly and weekly period types for pbi matrix

  - name: fct_rfm
    config:
      tags: ['weekly', 'crm']
    description: customer-level rfm scores and segments based on executed orders

  - name: fct_banner_performance
    config:
      tags: ['daily', 'ga4']
    description: >
      banner performance by promotion_name + placement_type + creative_slot + event_date.
      metrics: impressions, clicks, ctr, click_sessions, add_to_cart_sessions,
      checkout_sessions, purchase_sessions, revenue (same-session attribution).
    columns:
      - name: event_date
        tests:
          - not_null
      - name: promotion_name
        tests:
          - not_null

  - name: fct_crm_item_cross_sell
    config:
      tags: ['weekly', 'crm']
    description: all unique product pairs from executed crm orders with co-purchase counts and per-item order totals for cross-sell analysis in pbi

  - name: fct_crm__supplies_sku
    config:
      tags: ['daily', 'crm']
    description: >
      one row per product_sku. procurement vs sales snapshot since 2025-06-01.
      includes stock levels, weighted average margin, turnover days, and flags
      for dead stock and redundant ordering.
    columns:
      - name: product_sku
        tests:
          - not_null
          - unique
      - name: gross_margin_pct
        description: (avg_selling_price - avg_purchase_price) / avg_selling_price. null when no priced sales exist
      - name: is_dead_stock
        description: true when total_sold_units = 0 since 2025-06-01
      - name: is_overstocked_at_procurement
        description: true when stock_days_at_last_procurement > 60

  - name: fct_crm__supplies_supplier
    config:
      tags: ['daily', 'crm']
    description: >
      one row per supplier. aggregated from fct_crm__supplies_sku plus procurement
      frequency from stg_crm__supplies. use for supplier concentration and regularity analysis.
    columns:
      - name: supplier_nr
        tests:
          - not_null
          - unique
      - name: avg_gross_margin_pct
        description: weighted average by total_sold_revenue across supplier skus
      - name: procurement_share_pct
        description: supplier share of total procurement cost across all suppliers since 2025-06-01
      - name: avg_days_between_procurements
        description: average gap in days between consecutive procurement dates for this supplier
